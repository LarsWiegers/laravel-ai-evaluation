name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]
        laravel-ai: ['0.5.*', '0.6.*', '0.7.*']
        stability: [prefer-lowest, prefer-stable]

    name: PHP ${{ matrix.php }} - Laravel AI ${{ matrix.laravel-ai }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Pin Laravel AI version
        run: composer require "laravel/ai:${{ matrix.laravel-ai }}" --no-update --no-interaction

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: composer test

  github-report-format:
    runs-on: ubuntu-latest
    name: GitHub annotation report format

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, mbstring, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Test GitHub annotation report format
        shell: bash
        run: |
          marker="$(uuidgen)"
          echo "::stop-commands::$marker"

          set +e
          output=$(composer exec -- testbench ai-evals:run ../../../../workbench/evals --format=github 2>&1)
          status=$?
          set -e

          printf '%s\n' "$output"
          echo "::$marker::"

          if [ "$status" -ne 1 ]; then
            echo "Expected GitHub report fixture to exit with 1, got $status"
            exit 1
          fi

          if [[ "$output" != *"::error file=workbench/evals/reporting.eval.php,line=35"* ]]; then
            echo "Expected GitHub annotation output was not found"
            exit 1
          fi

  docs-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install docs dependencies
        run: npm install
        working-directory: docs

      - name: Build VitePress docs
        run: npm run docs:build
        working-directory: docs

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  docs-deploy:
    runs-on: ubuntu-latest
    needs: [test, docs-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
